<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carolina Police Department — SWAT Command Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090b;
    --bg-2: #101317;
    --bg-3: #15181c;
    --gold: #c9a227;
    --gold-bright: #e0bc4d;
    --gold-dim: #5c4b16;
    --text: #eceeef;
    --text-muted: #7c828a;
    --text-faint: #4a4f56;
    --border: #212529;
    --border-bright: #34383f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, #1b1f24 0%, transparent 60%),
      radial-gradient(ellipse 1200px 800px at 50% 110%, #14171b 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    min-height: 100vh;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, black 20%, transparent 75%);
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 180px 60px rgba(0,0,0,0.75);
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 3rem 2rem;
    max-width: 660px;
    width: 100%;
  }

  .crest {
    width: 76px;
    height: 76px;
    margin: 0 auto 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: linear-gradient(160deg, var(--bg-3), #0c0e10);
    border: 1px solid var(--border-bright);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 0 30px rgba(201,162,39,0.08),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .crest::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
  }

  .crest span {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    color: var(--gold-bright);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    border: 1px solid var(--border-bright);
    background: rgba(255,255,255,0.02);
    color: var(--gold-bright);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 999px;
    margin-bottom: 30px;
  }

  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 10px var(--gold-bright);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .eyebrow {
    font-family: 'Oswald', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(2rem, 5.5vw, 3.4rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.1;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  h1 .accent { color: var(--gold-bright); }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.98rem;
    line-height: 1.6;
    max-width: 460px;
    margin: 0 auto 48px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: var(--gold-dim);
    margin: 0 auto 48px;
  }

  .countdown {
    display: flex;
    justify-content: center;
    gap: clamp(10px, 3vw, 20px);
    margin-bottom: 50px;
  }

  .unit {
    background: linear-gradient(160deg, var(--bg-3), var(--bg-2));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 8px 14px;
    min-width: 82px;
    position: relative;
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 20px rgba(0,0,0,0.35);
  }

  .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.7rem, 5vw, 2.5rem);
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .label {
    margin-top: 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .colon {
    display: flex;
    align-items: center;
    color: var(--border-bright);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
  }

  footer {
    color: var(--text-faint);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  footer strong {
    color: var(--text-muted);
  }

  @media (max-width: 460px) {
    .unit { min-width: 60px; padding: 14px 4px 10px; }
    .colon { display: none; }
    .countdown { gap: 10px; }
  }
</style>
</head>
<body>
  <div class="vignette"></div>
  <div class="container">
    <div class="crest"><span>CPD</span></div>
    <div class="badge"><span class="dot"></span>Restricted Access</div>

    <p class="eyebrow">Carolina Police Department</p>
    <h1>SWAT <span class="accent">Command Portal</span></h1>
    <p class="subtitle">Internal systems for the Special Weapons &amp; Tactics Unit are currently being brought online.</p>
    <div class="divider"></div>

    <div class="countdown">
      <div class="unit"><div class="num" id="days">00</div><div class="label">Days</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">Hrs</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">Min</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">Sec</div></div>
    </div>

    <footer>Authorized Personnel Only &middot; <strong>Carolina Police Department</strong></footer>
  </div>

  <script>
    // ---- Set your launch date/time here (local time) ----
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 7); // defaults to 7 days from now
    // Example to set an exact date instead:
    // const targetDate = new Date("2026-08-05T18:00:00");

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const now = new Date().getTime();
      const distance = targetDate.getTime() - now;

      if (distance <= 0) {
        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
